name: Scan VK Video

on:
  workflow_dispatch:
  schedule:
    # каждые 6 часов в 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Run poster
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python vk_poster.py
      - name: Commit state
        run: |
          git config user.name "vk-bot"
          git config user.email "bot@vk.local"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state [skip ci]"
            git push
          fi
