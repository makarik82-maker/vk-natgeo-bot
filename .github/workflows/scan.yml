name: Scan VK Video

on:
  workflow_dispatch: # ручная кнопка для тестов

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Run scanner
        run: python vk_scanner.py
