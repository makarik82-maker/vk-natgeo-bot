name: Scan VK Video

on:
  workflow_dispatch:
  schedule:
    # 8:00 и 19:00 по Москве (5:00 и 16:00 UTC)
    # Замени на '0 8,19 * * *' если нужно по UTC
    - cron: '0 5,16 * * *'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Run poster
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
        run: python vk_poster.py
      - name: Commit state
        run: |
          git config user.name "vk-bot"
          git config user.email "bot@vk.local"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state [skip ci]"
            git push
          fi
